# ─── Prefix: Ctrl+s ──────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── General Settings ────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1              # Start windows at 1
setw -g pane-base-index 1        # Start panes at 1
set -g renumber-windows on       # Renumber when window closed
set -g escape-time 0             # No delay for escape (important for nvim)
set -g history-limit 10000
set -g focus-events on           # For nvim autoread
set-option -g status-position top

# ─── Session Management ──────────────────────────────────
bind n command-prompt -p "New session name:" "new-session -s '%%'"
bind R command-prompt -p "Rename session:" "rename-session '%%'"
bind d detach-client
bind q confirm-before -p "Kill session #S? (y/n)" kill-session
bind ( switch-client -p  # Previous session
bind ) switch-client -n  # Next session
bind s choose-tree -Zs   # List sessions (interactive picker)

# ─── Vim-Tmux Navigator with Window Navigation ─────────────
# Detect vim/nvim processes
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"

# Navigation: Ctrl-h/l navigate panes, or windows at edge
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'if-shell -F "#{pane_at_left}" "previous-window" "select-pane -L"'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'if-shell -F "#{pane_at_right}" "next-window" "select-pane -R"'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'

# Copy mode navigation (with window support)
bind-key -T copy-mode-vi 'C-h' if-shell -F '#{pane_at_left}' 'previous-window' 'select-pane -L'
bind-key -T copy-mode-vi 'C-l' if-shell -F '#{pane_at_right}' 'next-window' 'select-pane -R'
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U


# ─── Pane Splits (nvim-like) ─────────────────────────────
bind -n C-s split-window -h -c "#{pane_current_path}"
bind -n C-v split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ─── Vi Copy Mode ────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ─── Utility ─────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind -n C-t new-window -c "#{pane_current_path}"
bind -n C-w kill-pane    # Close pane without confirmation

# ─── Plugins ─────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'

set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_current_number_color "#{@thm_green}"
set -g @catppuccin_window_text ""
set -g @catppuccin_window_number "#[bold]Tab ###I "
set -g @catppuccin_window_current_text ""
set -g @catppuccin_window_current_number "#[bold]Tab ###I "
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_right_separator "#[fg=#{@_ctp_status_bg},reverse]#[none]"

set -g @catppuccin_window_left_separator "#[fg=#{@_ctp_status_bg}]#[none]"
set -g @catppuccin_window_middle_separator "#[bg=#{@catppuccin_window_number_color},fg=#{@catppuccin_window_text_color}]"
set -g @catppuccin_window_current_middle_separator "#[bg=#{@catppuccin_window_current_number_color},fg=#{@catppuccin_window_current_text_color}]"

set -g window-status-separator ""
set -g status-left-length 0
set -g status-left "#[fg=#{@thm_fg} bold]TMUX (#S) "
set -ga status-left "#{?client_prefix,#[fg=#{@thm_red} bold]PREFIX ,#{?#{==:#{pane_mode},copy-mode},#[fg=#{@thm_yellow} bold]COPY ,#[fg=#{@thm_green} bold]NORMAL }}"
set -g status-right ""

# ─── Initialize TPM (keep at bottom) ─────────────────────
run '~/.tmux/plugins/tpm/tpm'
